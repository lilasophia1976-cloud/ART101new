<!DOCTYPE html>
<html lang="en">

<head>
   <!-- All techy stuff goes here, inside HEAD -->
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!-- Overall title of your page -->
   <title>my creature maker</title>
   <!-- Link to external CSS file -->
   <link rel="stylesheet" href="creature.css">
   <!-- jQuery library -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
   <!-- Link to external JavaScript file -->
   <script src="creature.js" DEFER></script>
</head>

<body>
    <!--Main content goes here-->
    <h1>Creatures Garden</h1>
 
    <div id="creature-form">
        <h2>Add a creature </h2>
        
        <div>Name: <input id="crName" type="text" maxlength="10"> </div>
        <div>Color: <input id="crColor" type="color"> </div>
        <div>Number of eyes: : <input id="crEyesNum" type="number" max="5"></div>


        <button id=crAdd> Let it roam!</button> 
        
    </div>

    <div id="creature-list"> </div>

</body>

</html>
